name: Feature request
description: Suggest an improvement or new capability
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Beskriv behovet først. Det gjør det lettere å vurdere både Noark 5-spesifikke løsninger og generisk funksjonalitet som kan være relevant for SIARD Workflow Manager.

  - type: textarea
    id: problem
    attributes:
      label: Problem or need
      description: Hvilket problem eller hvilken arbeidsprosess ønsker du å forbedre?
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Desired solution
      description: Hva ønsker du at Noark 5 Workflow Manager skal kunne gjøre?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Finnes det alternative løsninger eller eksisterende verktøy/arbeidsmåter?

  - type: dropdown
    id: scope
    attributes:
      label: Scope
      description: Hvordan vurderer du funksjonens omfang?
      options:
        - Noark 5-specific
        - Generic workflow functionality that may also be useful in SIARD Workflow Manager
        - Unsure
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Noark 5 validation / reporting
        - Arkade 5 integration
        - DIAS / AIP / AIC
        - PREMIS / provenance
        - Transfer / checksum / storage zones
        - Pipeline
        - Batch / recursive jobs
        - GUI / usability
        - Documentation
        - Other
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Legg til relevant bakgrunn. Ikke del sensitivt arkivmateriale.

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I have checked existing issues for a similar request.
          required: true
