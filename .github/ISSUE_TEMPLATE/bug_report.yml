name: Bug report
description: Report a reproducible problem in Noark 5 Workflow Manager
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Takk for at du melder en feil.

        Ikke legg ved sensitivt materiale, personopplysninger eller ekte arkivuttrekk som ikke kan publiseres offentlig.

  - type: input
    id: version
    attributes:
      label: Version
      description: Hvilken versjon av Noark 5 Workflow Manager bruker du?
      placeholder: "f.eks. 0.1.0"
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: Operating system
      description: Oppgi Windows-versjon og eventuelt relevant miljø.
      placeholder: "f.eks. Windows 11 24H2"
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Hvilken del av programmet gjelder feilen?
      options:
        - GUI / general workflow
        - Noark 5 source / extraction
        - DIAS / AIP / AIC packaging
        - Metadata / info.xml / METS
        - PREMIS / provenance
        - Validation / reporting
        - Arkade 5 integration
        - Transfer / checksum / storage zones
        - Pipeline / batch / recursive jobs
        - Installation / startup
        - Other
    validations:
      required: true

  - type: textarea
    id: attempted
    attributes:
      label: What were you trying to do?
      description: Beskriv arbeidsoperasjonen og relevant kontekst.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected result
      description: Hva forventet du skulle skje?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual result
      description: Hva skjedde faktisk?
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Beskriv trinnene så konkret at feilen kan gjenskapes.
      placeholder: |
        1. Start ...
        2. Velg ...
        3. Kjør ...
        4. Feilen oppstår ...
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Log or error output
      description: Lim inn relevant logg/feilmelding. Fjern sensitiv informasjon først.
      render: text

  - type: textarea
    id: archival_context
    attributes:
      label: Noark 5 / preservation context
      description: Beskriv relevante egenskaper ved uttrekket eller bevaringsprosessen uten å dele sensitivt arkivmateriale.

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I have checked existing issues for the same problem.
          required: true
        - label: I have removed sensitive information and archival content that should not be public.
          required: true
